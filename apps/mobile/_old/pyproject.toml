[project]
name = "skus-app"
version = "2.0.0"
requires-python = ">=3.11"

[tool.flet]
org = "com.tuempresa"

[tool.flet.android]
split_per_abi = false
queries_intents = [
    { actions = ["android.intent.action.VIEW"], data = [{ scheme = "https" }] }
]
exclude = [
    "base_schema.sql",
    "config.sql",
    "release_info.json",
    ".env",
    "data",
    ".claude",
    "CLAUDE.md",
    "migrate_users.py",
    "storage",
]